setup:
  - nix:
      root:
        dir: "~/dotfiles"
        cmd: "vim config.nix"
        split:
          - v:
              dir: "~/dotfiles"
              cmd: "nix --version"
              size: 15
  - tmux:
      root:
        dir: "~/dotfiles"
        cmd: "vim tmux-session.yaml"
        split:
          - v:
              dir: "~/dotfiles"
              cmd: "tmux has-session -t setup"
              size: 15

workspaces:
  - gateway:
      root:
        dir: "/workspaces"
        cmd: "hermes gateway"
  - workspace:
      root:
        dir: "/workspaces"
        cmd: "hermes"

